name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: app
        run: |
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install lightning timm albumentations opencv-python umap-learn
          pip install -r requirements.txt

      - name: Build
        working-directory: app
        run: pyinstaller radbrecim.spec --clean

      - name: Zip
        working-directory: app
        shell: pwsh
        run: Compress-Archive -Path dist/RadBrecim -DestinationPath RadBrecim-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app/RadBrecim-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        working-directory: app
        run: |
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install lightning timm albumentations opencv-python umap-learn
          pip install -r requirements.txt

      - name: Build
        working-directory: app
        run: pyinstaller radbrecim.spec --clean

      - name: Zip
        working-directory: app
        run: zip -r RadBrecim-linux.zip dist/RadBrecim

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: app/RadBrecim-linux.zip

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: linux-build

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            RadBrecim-windows.zip
            RadBrecim-linux.zip
