test_size: 0.3
num_classes: 5
augmentations:
  resize:
    size: 224
  hflip:
    perc: 0.5
  rotate:
    perc: 0.5
    limit: 20
  contrast:
    perc: 0.2
  gauss_noise:
    perc: 0.1
  normalize:
    mean_vals: [0.485, 0.456, 0.406]
    std_vals: [0.229, 0.224, 0.225]
dataloader:
  batch_size: 8
  shuffle: True
  num_workers: 0